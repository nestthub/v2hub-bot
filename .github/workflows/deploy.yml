name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Guard against missing secrets
        run: |
          missing=0

          for var in HOST PORT USER SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "Missing required secret: $var"
              missing=1
            fi
          done

          if [ "$missing" = "1" ]; then
            exit 1
          fi
        env:
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
          USER: ${{ secrets.USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Resolve commit to deploy
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            sha="${{ github.sha }}"
          else
            sha="${{ github.event.workflow_run.head_sha }}"
          fi

          if [ -z "$sha" ]; then
            echo "Could not resolve a commit SHA to deploy"
            exit 1
          fi

          echo "Deploying commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p "${{ secrets.PORT }}" -H "${{ secrets.HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy and migrate
        env:
          DEPLOY_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p "${{ secrets.PORT }}" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "${{ secrets.USER }}@${{ secrets.HOST }}" \
            "DEPLOY_SHA='${DEPLOY_SHA}' bash -s" <<'EOF'

          set -euo pipefail
          set -x

          cd /root/v2hub-bot

          echo "=== Fetching commit ${DEPLOY_SHA} ==="
          git fetch origin "${DEPLOY_SHA}" < /dev/null
          git checkout --force "${DEPLOY_SHA}" < /dev/null

          echo "=== Current commit ==="
          git rev-parse HEAD

          echo "=== Pulling images if available ==="
          docker compose pull < /dev/null || true

          echo "=== Building bot image ==="
          docker compose build bot < /dev/null

          echo "=== Starting database ==="
          docker compose up -d db < /dev/null

          echo "=== Waiting for database ==="
          db_ready=0

          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready < /dev/null; then
              echo "Database is ready."
              db_ready=1
              break
            fi

            echo "Database is not ready yet ($i/30)"
            sleep 2
          done

          if [ "$db_ready" -ne 1 ]; then
            echo "ERROR: Database did not become ready."
            docker compose logs --tail=200 db
            exit 1
          fi

          echo "=== Running database migrations ==="
          docker compose run \
            --rm \
            --no-deps \
            bot \
            alembic upgrade head < /dev/null

          echo "=== Starting bot ==="
          docker compose up -d --force-recreate bot < /dev/null

          echo "=== Container status ==="
          docker compose ps

          echo "=== Checking bot container ==="
          if ! docker compose ps --status running --services | grep -qx "bot"; then
            echo "ERROR: bot container is not running."
            docker compose logs --tail=200 bot
            exit 1
          fi

          echo "=== Verifying deployed commit ==="
          running_sha="$(git rev-parse HEAD < /dev/null)"

          if [ "$running_sha" != "${DEPLOY_SHA}" ]; then
            echo "ERROR: deployed commit ($running_sha) does not match target commit (${DEPLOY_SHA})"
            exit 1
          fi

          echo "=== Cleaning up ==="
          docker image prune -f < /dev/null
          docker builder prune -f --filter until=168h < /dev/null

          echo "=== DEPLOY SUCCESS ==="
          echo "Commit: ${DEPLOY_SHA}"
          echo "Migrations: completed"
          echo "Bot container: running"
          EOF

      - name: Clean up local SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
